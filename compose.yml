name: legal-workbench

x-backend-build: &backend-build
  context: .
  dockerfile: infra/docker/backend.Dockerfile
  args:
    CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:?Set CODEX_CLI_VERSION in .env}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-bookworm
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_workbench}
      POSTGRES_USER: ${POSTGRES_USER:-legal_workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legal_workbench} -d ${POSTGRES_DB:-legal_workbench}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: *backend-build
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      LEGAL_WORKBENCH_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-legal_workbench}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-legal_workbench}
      LEGAL_WORKBENCH_REDIS_URL: redis://redis:6379/0
      CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:?Set CODEX_CLI_VERSION in .env}
    command:
      - /bin/sh
      - -c
      - alembic -c apps/backend/alembic.ini upgrade head && uvicorn legal_workbench.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./data/knowledge:/data/knowledge:ro
      - ${LEGAL_WORKBENCH_OPS_CODEX_RUNS_ROOT:-./data/codex-runs}:/data/codex-runs
      - ${LEGAL_WORKBENCH_OPS_ATTACHMENT_ROOT:-./data/feishu-attachments}:/data/feishu-attachments
      - ${LEGAL_WORKBENCH_OPS_STATE_ROOT:-./data/operations}:/data/operations:ro
      - ${LEGAL_WORKBENCH_OPS_BACKUP_ROOT:-./data/backups}:/data/backups:ro
      - ./data/local-secrets:/data/local-secrets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build: *backend-build
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      LEGAL_WORKBENCH_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-legal_workbench}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-legal_workbench}
      LEGAL_WORKBENCH_REDIS_URL: redis://redis:6379/0
      CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:?Set CODEX_CLI_VERSION in .env}
      LEGAL_WORKBENCH_CODEX_SANDBOX_UID: "10001"
      LEGAL_WORKBENCH_CODEX_SANDBOX_GID: "10001"
    command:
      - celery
      - -A
      - legal_workbench.infrastructure.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
    volumes:
      - ${LEGAL_WORKBENCH_OPS_CODEX_RUNS_ROOT:-./data/codex-runs}:/data/codex-runs
      - ${LEGAL_WORKBENCH_OPS_ATTACHMENT_ROOT:-./data/feishu-attachments}:/data/feishu-attachments
      - ./data/document-extractions:/data/document-extractions
      - ./data/local-secrets:/data/local-secrets
    depends_on:
      api:
        condition: service_healthy

  scheduler:
    build: *backend-build
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      LEGAL_WORKBENCH_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-legal_workbench}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-legal_workbench}
      LEGAL_WORKBENCH_REDIS_URL: redis://redis:6379/0
      CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:?Set CODEX_CLI_VERSION in .env}
    command:
      - celery
      - -A
      - legal_workbench.infrastructure.celery_app:celery_app
      - beat
      - --loglevel=INFO
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}/api/v1
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

  feishu-connector:
    build: *backend-build
    profiles: ["integrations"]
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      LEGAL_WORKBENCH_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-legal_workbench}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-legal_workbench}
      LEGAL_WORKBENCH_REDIS_URL: redis://redis:6379/0
      CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:?Set CODEX_CLI_VERSION in .env}
    command: ["python", "-m", "legal_workbench.integrations.feishu_connector"]
    volumes:
      - ${LEGAL_WORKBENCH_OPS_ATTACHMENT_ROOT:-./data/feishu-attachments}:/data/feishu-attachments
    depends_on:
      api:
        condition: service_healthy

  file-indexer:
    build: *backend-build
    profiles: ["integrations"]
    restart: "no"
    logging: *default-logging
    env_file:
      - .env
    environment:
      LEGAL_WORKBENCH_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-legal_workbench}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-legal_workbench}
      LEGAL_WORKBENCH_REDIS_URL: redis://redis:6379/0
      CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:?Set CODEX_CLI_VERSION in .env}
    command: ["python", "-m", "legal_workbench.integrations.file_indexer"]
    volumes:
      - ./data/knowledge:/data/knowledge:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
