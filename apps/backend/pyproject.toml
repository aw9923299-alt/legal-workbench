[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-workbench-backend"
version = "0.2.0"
description = "Python backend for the local Codex-powered legal workbench."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.18.5,<2",
  "celery[redis]>=5.6.3,<6",
  "fastapi>=0.139.2,<1",
  "httpx>=0.28,<1",
  "pgvector>=0.5,<1",
  "pydantic>=2.13,<3",
  "psycopg[binary,pool]>=3.3.4,<4",
  "pydantic-settings>=2.8,<3",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0.51,<2.1",
  "structlog>=25,<26",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
packages = ["legal_workbench"]
mypy_path = "apps/backend/src"
warn_unused_ignores = true

[tool.coverage.run]
source = ["legal_workbench"]
branch = true
