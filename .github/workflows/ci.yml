name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18-bookworm
        env:
          POSTGRES_DB: legal_workbench_test
          POSTGRES_USER: legal_workbench
          POSTGRES_PASSWORD: legal_workbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legal_workbench -d legal_workbench_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      LEGAL_WORKBENCH_DATABASE_URL: >-
        postgresql+psycopg://legal_workbench:legal_workbench@localhost:5432/legal_workbench_test
      LEGAL_WORKBENCH_TEST_DATABASE_URL: >-
        postgresql+psycopg://legal_workbench:legal_workbench@localhost:5432/legal_workbench_test
      RUN_POSTGRES_INTEGRATION_TESTS: "1"
      RUN_REDIS_INTEGRATION_TESTS: "1"
      LEGAL_WORKBENCH_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e 'apps/backend[dev]'
      - name: Apply database migrations
        run: python -m alembic -c apps/backend/alembic.ini upgrade head
      - name: Ruff
        run: python -m ruff check apps/backend/src apps/backend/tests
      - name: Mypy
        run: python -m mypy --config-file apps/backend/pyproject.toml apps/backend/src
      - name: Pytest
        run: python -m pytest apps/backend/tests

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: cp .env.example .env && docker compose config --quiet
