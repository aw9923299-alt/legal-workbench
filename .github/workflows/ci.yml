name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18-bookworm
        env:
          POSTGRES_DB: legal_workbench_test
          POSTGRES_USER: legal_workbench
          POSTGRES_PASSWORD: legal_workbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legal_workbench -d legal_workbench_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      LEGAL_WORKBENCH_DATABASE_URL: >-
        postgresql+psycopg://legal_workbench:legal_workbench@localhost:5432/legal_workbench_test
      LEGAL_WORKBENCH_TEST_DATABASE_URL: >-
        postgresql+psycopg://legal_workbench:legal_workbench@localhost:5432/legal_workbench_test
      RUN_POSTGRES_INTEGRATION_TESTS: "1"
      RUN_REDIS_INTEGRATION_TESTS: "1"
      LEGAL_WORKBENCH_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - name: Install backend dependencies
        working-directory: apps/backend
        run: uv sync --locked
      - name: Apply database migrations
        working-directory: apps/backend
        run: uv run --locked alembic -c alembic.ini upgrade head
      - name: Ruff
        working-directory: apps/backend
        run: uv run --locked ruff check src tests
      - name: Mypy
        working-directory: apps/backend
        run: uv run --locked mypy --config-file pyproject.toml src
      - name: Pytest
        working-directory: apps/backend
        run: uv run --locked pytest
      - name: Round-trip latest migration with populated data
        working-directory: apps/backend
        run: |
          uv run --locked alembic -c alembic.ini downgrade -1
          uv run --locked alembic -c alembic.ini upgrade head

  production-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: cp .env.example .env && docker compose config --quiet
      - name: Build production API and Web images
        run: docker compose build api web
      - name: Smoke production image runtimes
        run: |
          docker compose run --rm --no-deps api sh -c 'python --version && codex --version'
          docker compose run --rm --no-deps web nginx -t
