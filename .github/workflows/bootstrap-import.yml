name: Bootstrap repository snapshot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/legal-workbench.b64
          base64 --decode /tmp/legal-workbench.b64 > /tmp/legal-workbench.tar.xz
          tar -xJf /tmp/legal-workbench.tar.xz
          rm -rf .bootstrap .github/workflows/bootstrap-import.yml .github/workflows/ci.yml

      - name: Commit imported source and design
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes to import."
            exit 0
          fi
          git commit -m "docs: define local Codex legal workbench architecture"
          git push origin HEAD:main
