name: Matter Continuity Apply

on:
  push:
    branches: [codex/matter-continuity-v1]
    paths:
      - scripts/apply_matter_continuity_frontend.py
      - .github/workflows/matter-continuity-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/matter-continuity-v1
          fetch-depth: 0
      - name: Apply deterministic frontend patch
        run: python scripts/apply_matter_continuity_frontend.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/MessageDetailPage.tsx
          git diff --cached --check
          git commit -m "feat: surface deterministic matter recommendations"
          git push origin HEAD:codex/matter-continuity-v1
